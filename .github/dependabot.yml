version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ferramentas:
        patterns: ["@playwright/*", "@axe-core/*", "eslint*", "typescript*", "@eslint/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
